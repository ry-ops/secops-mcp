[project]
name = "secops-mcp"
version = "0.1.0"
description = "MCP server that turns Wazuh/Sandfly/Checkmk alerts into reviewable Ansible remediation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
secops-mcp = "secops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secops_mcp"]
